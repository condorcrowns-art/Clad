<!-- No AdSense here, deliberately. Google's own review rejected the site for
     "ads on screens without publisher content... used for alerts, navigation,
     or other behavioural purposes" — a precise description of this app: Home,
     Talk, Review, Games and Settings are controls, not text. The script now
     loads only on the prose pages (about.html, guides/*.html) that are
     actually the kind of thing the policy means by "content". See
     tools/build-pages.js and ADSENSE.md. -->
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="alternate icon" href="icon-192.png">
<!-- With scripting off the chrome is furniture around nothing: a streak of
     zero, a nav whose every button is dead, and the word "Loading…" that will
     never stop. Hide it and leave only the explanation below. -->
<noscript><style>
  .topbar, .nav, #app, .sheet, .sheet-scrim { display: none !important; }
</style></noscript>

<body>

<div class="topbar">
  <button class="brand" id="brandBtn"><span class="dot"></span>Lunosia</button>
  <div class="spacer"></div>
  <span class="chip" id="chipStreak" title="Day streak">🔥 <span>0</span></span>
  <span class="chip" id="chipLevel" title="Your level">LV 1</span>
  <span class="chip" id="chipBrain" title="Conversation engine">scripted</span>
</div>

<div id="app"><main><p class="muted">Loading…</p></main></div>

<!-- Without scripting this page is one word long, which is no use to a reader
     and no use to a crawler either. The real explanation lives on about.html;
     this is the short version, in the markup, for anyone who never gets the
     app. -->
<noscript>
  <main style="max-width:720px;margin:0 auto;padding:24px 20px 60px">
    <h1>Lunosia — learn Spanish by talking</h1>
    <p>Lunosia is a free Spanish trainer built around speaking. You hold a
       conversation out loud with a partner who stays in character, and when you
       get something wrong it tells you what to say instead and names the rule
       you broke — then brings that sentence back days later until you can
       produce the fix from memory.</p>
    <p>It also covers reading (twelve graded stories, every word one tap from its
       meaning), listening, writing, pronunciation and twenty grammar lessons
       aimed at the mistakes English speakers actually make. There is no account
       and no subscription, and after the first visit it works offline.</p>
    <p>The app itself needs JavaScript, because the dictionary, the grammar
       checker and the speech both run in your browser rather than on a server.
       Turn scripting on for this site to use it.</p>
    <p><a href="about.html">Read more about Lunosia</a> ·
       <a href="guides/index.html">Spanish grammar guides</a> ·
       <a href="contact.html">Contact</a> ·
       <a href="privacy.html">Privacy</a></p>
  </main>
</noscript>

<!-- Twelve tabs do not fit across a phone. The five marked data-primary stay on
     the bar at any width; the rest move into the More sheet below 620px and sit
     on the bar above it.

     The five are the things you *do* daily, which is why Read is on the bar and
     Words is not: the word bank is a place to browse thirty thousand words, and
     Ask already covers looking one up. -->
<nav class="nav" id="nav">
  <button data-view="home"      data-primary><span class="ico">🏠</span>Home</button>
  <button data-view="scenarios" data-primary><span class="ico">💬</span>Talk</button>
  <button data-view="read"      data-primary><span class="ico">📖</span>Read</button>
  <button data-view="review"    data-primary><span class="ico">🔁</span>Review</button>
  <button data-view="coach"     data-primary><span class="ico">🔎</span>Ask</button>
  <button data-view="words"><span class="ico">📚</span>Words</button>
  <button data-view="grammar"><span class="ico">📐</span>Grammar</button>
  <button data-view="say"><span class="ico">👄</span>Sounds</button>
  <button data-view="write"><span class="ico">✍️</span>Write</button>
  <button data-view="games"><span class="ico">🎮</span>Games</button>
  <button data-view="conjugate"><span class="ico">🧩</span>Verbs</button>
  <button data-view="challenge"><span class="ico">🎯</span>60 days</button>
  <button data-view="progress"><span class="ico">📊</span>Stats</button>
  <button class="nav-more" id="navMore" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="ico">☰</span>More</button>
</nav>
